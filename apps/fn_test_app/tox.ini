# Generated with resilient-sdk v51.0.7.2.16540
# Tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist = py310
skip_missing_interpreters=True

[testenv:py27]
skip_install=true
ignore_outcome=true

[testenv]
passenv=TEST_RESILIENT_*
commands = pytest -s {posargs}
markers =
    livetest: mark as a test which will be ran against a live system (deselect with '-m "not livetest"')
    mock: mark as a test which has mocked all live interactions with a service
deps =
    pytest
    mock
    # resilient-app-config-plugins 1.0.5 imports this on Python 3.10 but
    # incorrectly declares it only for Python >= 3.11.
    requests-pkcs12==1.27
    resilient-circuits
    pytest-resilient-circuits
