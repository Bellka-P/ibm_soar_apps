name: Build tagged IBM SOAR app image

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse and validate application tag
        id: app
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^([a-z0-9_]+)-v([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Invalid tag '${RELEASE_TAG}'. Expected <app_name>-v<version>." >&2
            exit 1
          fi

          app_name="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          app_dir="apps/${app_name}"

          test -d "${app_dir}" || { echo "Missing ${app_dir}" >&2; exit 1; }
          test -f "${app_dir}/Dockerfile" || { echo "Missing ${app_dir}/Dockerfile" >&2; exit 1; }
          test -f "${app_dir}/setup.py" || { echo "Missing ${app_dir}/setup.py" >&2; exit 1; }
          test -f "${app_dir}/package.json" || { echo "Missing ${app_dir}/package.json" >&2; exit 1; }

          python_version="$(cd "${app_dir}" && python setup.py --version)"
          json_version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "${app_dir}/package.json")"

          test "${python_version}" = "${version}" || {
            echo "setup.py version '${python_version}' does not match tag version '${version}'." >&2
            exit 1
          }
          test "${json_version}" = "${version}" || {
            echo "package.json version '${json_version}' does not match tag version '${version}'." >&2
            exit 1
          }

          echo "app_name=${app_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "app_dir=${app_dir}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/bellka-p/${app_name}:${version}" >> "${GITHUB_OUTPUT}"

      - name: Build Python source distribution
        shell: bash
        working-directory: ${{ steps.app.outputs.app_dir }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade setuptools wheel
          python setup.py sdist --formats=gztar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.app.outputs.app_dir }}
          file: ${{ steps.app.outputs.app_dir }}/Dockerfile
          push: true
          tags: ${{ steps.app.outputs.image }}
          provenance: true
          sbom: true
